baseURL = "https://www.abetterinternet.org/"
locale = "en-US"

contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[taxonomies]
# Explicitly empty to disable Hugo's default tags/categories taxonomies

[params]
copyrighthtml = "Internet Security Research Group"
address = "548 Market St, PMB 77519, San Francisco, California 94104-5401"
images = ["images/opengraph/ISRG-opengraph-wide.png"]

# Date and time formatting, see https://gohugo.io/functions/format/
time_format_RFC3339 = "2006-01-02T15:04:05Z07:00"
time_format_RFC822 = "Mon, 02 Jan 2006 15:04:05 -0700"
time_format_default = "Jan 2, 2006"

[security]
# Hugo's default content policy is ['! ^text/html$'], which rejects HTML
# content files. Much of this site's content is authored as .html, so allow all
# content media types.
allowContent = ['.']

[markup]
defaultMarkdownHandler = "goldmark"

[markup.goldmark]
[markup.goldmark.extensions]
typographer = false
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser]
# To keep § ids identical after the migration from blackfriday to goldmark
autoHeadingIDType = "blackfriday"

[languages]
[languages.en]
title = "Internet Security Research Group"
label = "English"
# Weight used for sorting.
weight = 1
[languages.en.params]
description = """
  ISRG&rsquo;s mission is to protect Internet users by lowering monetary, technological, and informational barriers to a more secure and privacy-respecting Internet.
"""

# Site banner messages with dates; see "Site banner" in README.md.
[[params.site_banner_schedule]]
id = "giving-tuesday"
start = "2026-12-01T00:00:00-06:00"
end = "2026-12-02T00:00:00-06:00"
text = "It’s Giving Tuesday! As a nonprofit, we rely on our generous community of donors."
label = "Donate Today"
href = "https://www.abetterinternet.org/donate/"

[[params.site_banner_schedule]]
id = "monthly"
start = "2026-12-02T00:00:00-06:00"
end = "2026-12-26T00:00:00-06:00"
text = "As we look toward 2027, consider a gift that keeps on giving. Internet security!"
label = "Donate monthly"
href = "https://www.abetterinternet.org/donate/"

[[params.site_banner_schedule]]
id = "year-end"
start = "2026-12-26T00:00:00-06:00"
end = "2027-01-01T00:00:00-06:00"
text = "ISRG protects billions of people online, every day. Join us by making a donation before December 31 to finish the year strong."
label = "Donate Today"
href = "https://www.abetterinternet.org/donate/"
